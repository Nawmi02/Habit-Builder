# Local development stack: PostgreSQL + Redis + Django API + Celery worker + Celery beat
#   docker compose up --build        -> start everything
#   docker compose up -d db redis    -> only database + redis (run Django from VS Code)

x-backend: &backend
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgres://habit:habit@db:5432/habit_builder
    REDIS_URL: redis://redis:6379/0
  volumes:
    - .:/app            # code changes apply without rebuilding
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: habit_builder
      POSTGRES_USER: habit
      POSTGRES_PASSWORD: habit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit -d habit_builder"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    <<: *backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A config worker -l info

  beat:
    <<: *backend
    command: celery -A config beat -l info

volumes:
  pgdata:
